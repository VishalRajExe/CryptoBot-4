version: '3.8'

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: cryptobot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL for production (optional, SQLite default)
  postgres:
    image: postgres:16-alpine
    container_name: cryptobot-postgres
    environment:
      POSTGRES_DB: cryptobot
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptobot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - postgres

  # Main API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptobot-api
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://cryptobot:${POSTGRES_PASSWORD:-cryptobot}@postgres:5432/cryptobot
      - REDIS_URL=redis://redis:6379/0
      - PAPER_TRADING=true
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./cryptobot:/app/cryptobot
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
    command: >
      sh -c "python -m cryptobot"

  # Dashboard frontend
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: cryptobot-dashboard
    environment:
      - VITE_API_BASE=http://localhost:8000/api/v1
    ports:
      - "8080:8080"
    depends_on:
      - api
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 8080

  # Telegram bot (optional, can run separately)
  telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptobot-telegram
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - API_BASE=http://api:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped
    command: python -m cryptobot.integrations.telegram

volumes:
  redis_data:
  postgres_data:

networks:
  default:
    name: cryptobot-network