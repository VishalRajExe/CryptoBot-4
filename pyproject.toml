[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptobot"
version = "0.1.0"
description = "Unified Crypto Trading Bot - Fully integrated intelligent trading system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Cryptobot Team", email = "team@cryptobot.dev"}
]
keywords = [
    "trading", "crypto", "bot", "quantitative", "backtesting", "portfolio", "risk-management"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5.0", "pydantic-settings>=2.1.0", "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0", "aiohttp>=3.9.0", "httpx>=0.25.0",
    "websockets>=12.0", "pandas>=2.1.0", "numpy>=1.24.0",
    "polars>=0.19.0", "ta-lib>=0.4.25", "torch>=2.1.0",
    "transformers>=4.35.0", "accelerate>=0.24.0", "scikit-learn>=1.3.0",
    "scipy>=1.11.0", "optuna>=3.4.0", "scikit-optimize>=0.10.0",
    "cvxpy>=1.4.0", "skfolio>=0.8.0", "vectorbt>=0.27.0",
    "backtesting>=0.3.0", "fastapi>=0.104.0", "uvicorn[standard]>=0.24.0",
    "redis>=5.0.0", "ccxt>=4.2.0", "plotly>=5.17.0",
    "matplotlib>=3.8.0", "python-dateutil>=2.8.2", "python-multipart>=0.0.6",
    "jinja2>=3.1.0", "click>=8.1.0", "rich>=13.5.0", "tenacity>=8.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0", "pytest-asyncio>=0.21.0", "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0", "black>=23.0.0", "ruff>=0.1.0",
    "mypy>=1.6.0", "pre-commit>=3.5.0"
]
dashboard = [
    "react>=18.2.0", "react-dom>=18.2.0", "react-router-dom>=6.22.0",
    "plotly.js-dist>=2.27.0", "react-plotly.js>=2.6.0", "zustand>=4.5.0",
    "axios>=1.6.0", "date-fns>=3.3.0", "lucide-react>=0.330.0",
    "clsx>=2.1.0", "tailwind-merge>=2.2.0"
]

[project.scripts]
cryptobot = "cryptobot.main:main"
cryptobot-api = "cryptobot.api.main:app"
cryptobot-dashboard = "dashboard.src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptobot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ANN", "T20", "TCH", "SIM", "PL", "ARG", "PTH", "ERA", "FUR", "ISC", "ICN", "PIE", "TID", "PYI", "NPY", "RSE", "RET", "FLY", "PD", "PGH", "TRY"]
ignore = ["E501", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN401"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106", "S113"]
"examples/*" = ["S101", "S106"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | dashboard/node_modules
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_reexport = true
strict_equality = true

[tool.coverage.run]
source = ["cryptobot"]
omit = ["tests/*", "*/migrations/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]